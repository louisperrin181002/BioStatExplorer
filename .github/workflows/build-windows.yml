name: Build Windows executable

on:
  push:
    branches: [main, upgrade-review]
    tags: ["v*"]
  workflow_dispatch: {}

# Needed to publish the release below
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      # Built from the .spec, not from a bare --onefile command. The spec
      # carries the hiddenimports that figure export needs: matplotlib picks
      # its writer from the file extension at save time, so a build without
      # them looks fine until someone asks for an SVG.
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm BioStatExplorer.spec

      # A release rather than a build artifact: artifacts count against a
      # 500 MB account-wide storage quota and expire, while a release asset
      # is neither, and gives a permanent link that can be sent to someone
      # without a GitHub account. The Mac build is added to the same release
      # by hand, so this step must not clear existing assets.
      - name: Publish the .exe as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'BioStatExplorer — latest build' }}
          # Not a prerelease: GitHub's "Latest release" link and badge
          # skip prereleases, so marking it one 404s the very URL that
          # gets sent to someone who just wants the download.
          prerelease: false
          make_latest: "true"
          body: |
            BioStatExplorer — statistics and figures for lab data. Windows build
            from `${{ github.sha }}`.

            **Windows:** download `BioStatExplorer.exe` and double-click it —
            nothing to install. SmartScreen will warn that the publisher is
            unknown: choose **More info → Run anyway**.

            **Mac (Apple Silicon):** download `BioStatExplorer-mac.zip`, unzip,
            drag **BioStatExplorer.app** to Applications, then **right-click it →
            Open → Open** the first time. Double-clicking gives "the developer
            cannot be verified" with no way forward.

            Both warnings appear because the app is not signed by a registered
            Apple or Microsoft developer.
          files: dist/BioStatExplorer.exe
          fail_on_unmatched_files: true
