name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name BioStatExplorer run.py

      - name: Upload the .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioStatExplorer-windows
          path: dist/BioStatExplorer.exe
